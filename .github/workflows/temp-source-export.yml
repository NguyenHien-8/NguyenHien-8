name: Temporary source export for local visual QA
on:
  push:
    branches:
      - feature/premium-28-motion-redesign
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Archive source files
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: premium-source-snapshot
          path: source-snapshot.zip
          retention-days: 1
