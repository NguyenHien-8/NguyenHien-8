<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">FastAPI — technical motion showcase</title>
<desc id="desc">An endpoint router matches GET /v1 and serializes a fast JSON reply. Authentic logo paths, shapes, and brand colors are preserved.</desc>
<style><![CDATA[
.tech-effect{opacity:.78;pointer-events:none;transition:opacity .36s ease}
.tech-effect .hover-detail{opacity:0;transition:opacity .36s ease}
