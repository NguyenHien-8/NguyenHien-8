<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">MySQL — animated technology icon</title>
<desc id="desc">Self-contained animated vector icon, gently floating with a rotating illuminated orbit.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#252D40"/><stop offset=".54" stop-color="#171E2C"/><stop offset="1" stop-color="#111725"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6BC3E9" stop-opacity=".6"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#6BC3E9" stop-opacity=".22"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#6BC3E9" stop-opacity=".26"/><stop offset="1" stop-color="#6BC3E9" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
</defs>
<rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
<g clip-path="url(#clip)">
 <circle cx="47" cy="47" r="35" fill="url(#halo)">
   <animate attributeName="opacity" values=".66;1;.66" dur="4.11s" begin="-3.06s" repeatCount="indefinite"/>
 </circle>
 <path d="M6 24Q6 6 24 6H48" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
</g>
<rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<circle cx="32" cy="30" r="24.7" fill="none" stroke="#6BC3E9" stroke-opacity=".09" stroke-width=".9"/>
<g>
 <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 32 30" to="360 32 30" dur="7.00s" begin="-3.06s" repeatCount="indefinite"/>
 <circle cx="32" cy="30" r="24.7" fill="none" stroke="#6BC3E9" stroke-opacity=".64" stroke-width="1.55" stroke-dasharray="14 141"/>
 <circle cx="56.7" cy="30" r="2.3" fill="#6BC3E9"/>
 <circle cx="56.7" cy="30" r="4.9" fill="#6BC3E9" opacity=".16"/>
</g>
<g transform="translate(32 30)">
 <g>
  <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 1.35;0 -1.9;0 1.35" keyTimes="0;.5;1" dur="4.11s" begin="-3.06s" repeatCount="indefinite"/>
  <path d="M-18 10Q-12-10 2-15Q13-17 18-8Q12-10 8-5L15 0Q19 5 15 12Q8 18-5 14M-10 1Q-3-4 3 0M10-8L17-15" fill="none" stroke="#ADDEF7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="9" cy="-11" r="1.4" fill="#F9FBFF" />
 </g>
</g>
<circle cx="13" cy="51" r="1.2" fill="#6BC3E9" opacity=".4"><animate attributeName="opacity" values=".22;.8;.22" dur="2.80s" begin="-3.06s" repeatCount="indefinite"/></circle>
<circle cx="52" cy="11" r=".9" fill="#FFFFFF" opacity=".24"><animate attributeName="opacity" values=".12;.7;.12" dur="2.10s" begin="-3.06s" repeatCount="indefinite"/></circle>
</svg>