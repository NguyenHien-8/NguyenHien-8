 <radialGradient id="halo"><stop offset="0" stop-color="#34ADFA" stop-opacity=".26"/><stop offset="1" stop-color="#34ADFA" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
</defs>
<rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
