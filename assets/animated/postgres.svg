<circle cx="32" cy="30" r="24.7" fill="none" stroke="#79A9E3" stroke-opacity=".09" stroke-width=".9"/>
<g>
 <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 32 30" to="360 32 30" dur="7.80s" begin="-3.23s" repeatCount="indefinite"/>
