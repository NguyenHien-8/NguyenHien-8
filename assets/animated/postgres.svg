  <path d="M-17-10Q-16-20-5-17Q0-19 4-16Q16-20 18-10L16 6Q12 11 7 7L5 17Q1 22-4 16L-4 2Q-11 8-17 1Z" fill="#77A6D8" /><path d="M-4-12Q-2-5-3 2L-4 13Q-3 18 1 16L3 4Q3-4 6-12M-13-9L-8-7M11-9L7-7" fill="none" stroke="#F4FBFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-8" cy="-5" r="1.4" fill="#F9FBFF" /><circle cx="10" cy="-5" r="1.4" fill="#F9FBFF" />
 </g>
</g>
<circle cx="13" cy="51" r="1.2" fill="#79A9E3" opacity=".4"><animate attributeName="opacity" values=".22;.8;.22" dur="2.95s" begin="-3.23s" repeatCount="indefinite"/></circle>
