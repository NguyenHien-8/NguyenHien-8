<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">C: interactive technology animation</title>
<desc id="desc">Binary registers switch values while an instruction bus processes memory. Official logo artwork is preserved without changes.</desc>
<style>
