<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">Kotlin — semantic animated logo</title>
<desc id="desc">A diagonal color sweep represents Kotlin's multiplatform design. The underlying brand artwork stays unchanged.</desc>
