<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">Kotlin: interactive technology animation</title>
<desc id="desc">Two controlled gradient streams cross to suggest Kotlin's modern language flow. Official logo artwork is preserved without changes.</desc>
<style>
.tech-effect{opacity:.46;pointer-events:none;transition:opacity .35s ease}
:root:hover > .tech-effect,:root:focus > .tech-effect{opacity:.96}
:root:active > .tech-effect{opacity:1}
@media (prefers-reduced-motion:reduce){.tech-effect{display:none}}
</style>
<svg x="4" width="56" y="4" height="56" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="256" height="256" rx="60" fill="#242938"/>
<path d="M218 218H38V38H218L128 128L218 218Z" fill="url(#paint0_linear_7_120)"/>
<defs>
<linearGradient id="paint0_linear_7_120" x1="218" y1="38" x2="38" y2="218" gradientUnits="userSpaceOnUse">
<stop offset="0.00343514" stop-color="#E44857"/>
<stop offset="0.4689" stop-color="#C711E1"/>
<stop offset="1" stop-color="#7F52FF"/>
</linearGradient>
</defs>
</svg>
<g class="tech-effect" aria-hidden="true">
<defs><linearGradient id="fx-kotlin-flow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F58545"/><stop offset=".48" stop-color="#E86ACF"/><stop offset="1" stop-color="#9A7CFF"/></linearGradient></defs><g fill="none" stroke="url(#fx-kotlin-flow)" stroke-width="2.1" stroke-linecap="round"><path d="M7 52Q20 39 32 52T57 52" stroke-dasharray="9 80"><animate attributeName="stroke-dashoffset" values="0;-80" dur="4.8s" repeatCount="indefinite"/></path><path d="M8 45Q20 59 33 45T56 45" stroke-dasharray="9 80"><animate attributeName="stroke-dashoffset" values="-40;-120" dur="5.5s" repeatCount="indefinite"/></path></g>
</g>
</svg>
