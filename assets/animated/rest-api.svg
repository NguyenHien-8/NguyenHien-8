<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">REST API — semantic animated logo</title>
<desc id="desc">HTTP request and response packets run in opposite directions and return success status. Original artwork retained.</desc>
