<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">REST API: interactive technology animation</title>
<desc id="desc">A client sends an HTTP request to a server, which returns a differently coded response. Official logo artwork is preserved without changes.</desc>
<style>
.tech-effect{opacity:.46;pointer-events:none;transition:opacity .35s ease}
:root:hover > .tech-effect,:root:focus > .tech-effect{opacity:.96}
:root:active > .tech-effect{opacity:1}
@media (prefers-reduced-motion:reduce){.tech-effect{display:none}}
</style>
<svg xmlns="http://www.w3.org/2000/svg" x="4" width="56" y="4" height="56" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">REST API</title>
  <desc id="desc">A teal rounded-square icon with a code symbol and REST label.</desc>
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <path d="m22 20-9 10 9 10M42 20l9 10-9 10M36 17l-8 26" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="56" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REST</text>
</svg>
<g class="tech-effect" aria-hidden="true">
<g font-family="monospace" font-size="4.6" text-anchor="middle" fill="#DDFFF9"><text x="16" y="44">CLIENT</text><text x="49" y="44">SERVER</text></g><g fill="none" stroke-width="1.25"><rect x="7" y="46" width="18" height="12" rx="2" stroke="#A4FFE6"/><rect x="39" y="46" width="18" height="12" rx="2" stroke="#D8E9FF"/><path d="M26 49H38" stroke="#A4FFE6"/><path d="M38 55H26" stroke="#D8E9FF"/></g><circle r="1.7" fill="#9FFFE2"><animateMotion path="M26 49H38" dur="3.6s" begin="0s" repeatCount="indefinite" calcMode="paced"/></circle><circle r="1.7" fill="#E1F1FF"><animateMotion path="M38 55H26" dur="3.6s" begin="-1.8s" repeatCount="indefinite" calcMode="paced"/></circle><g fill="#C5FFE9"><circle cx="16" cy="52" r="1.5"/><circle cx="49" cy="52" r="1.5"/></g>
</g>
</svg>
