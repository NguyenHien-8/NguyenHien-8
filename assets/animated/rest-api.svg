<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">REST API — animated REST API pictogram</title>
<desc id="desc">Custom REST API icon with subtle light sweep, floating motion and glowing accent dots.</desc>
<defs>
  <radialGradient id="aura"><stop stop-color="#5ED8CF" stop-opacity=".34"/><stop offset="1" stop-color="#5ED8CF" stop-opacity="0"/></radialGradient>
  <clipPath id="trim"><rect x="4" y="4" width="56" height="56" rx="13"/></clipPath>
</defs>
<circle cx="32" cy="32" r="31" fill="url(#aura)">
  <animate attributeName="opacity" values=".45;.95;.45" dur="4.20s" begin="-7.02s" repeatCount="indefinite"/>
</circle>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0.8;0 -1.15;0 0.8" dur="4.20s" begin="-7.02s" repeatCount="indefinite"/>
  <svg xmlns="http://www.w3.org/2000/svg" x="4" width="56" y="4" height="56" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">REST API</title>
  <desc id="desc">A teal rounded-square icon with a code symbol and REST label.</desc>
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <path d="m22 20-9 10 9 10M42 20l9 10-9 10M36 17l-8 26" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="56" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REST</text>
</svg>


  <g clip-path="url(#trim)">
    <path d="M-42 4H-18L9 60H-15Z" fill="#fff" opacity=".115">
      <animateTransform attributeName="transform" type="translate" values="-25 0;120 0" dur="6.00s" begin="-7.02s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
<g>
  <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="10.0s" begin="-7.02s" repeatCount="indefinite"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#5ED8CF" stroke-opacity=".33" stroke-width="1.2" stroke-dasharray="11 177"/>
  <circle cx="62" cy="32" r="1.6" fill="#5ED8CF"/>
</g>
</svg>