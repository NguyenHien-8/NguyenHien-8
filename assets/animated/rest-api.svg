<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">REST API — animated technology icon</title>
<desc id="desc">Self-contained animated vector icon, gently floating with a rotating illuminated orbit.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#252D40"/><stop offset=".54" stop-color="#171E2C"/><stop offset="1" stop-color="#111725"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#51D9C5" stop-opacity=".6"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#51D9C5" stop-opacity=".22"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#51D9C5" stop-opacity=".26"/><stop offset="1" stop-color="#51D9C5" stop-opacity="0"/></radialGradient>
 <clipPath id="clip"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
</defs>
<rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
<g clip-path="url(#clip)">
 <circle cx="47" cy="47" r="35" fill="url(#halo)">
   <animate attributeName="opacity" values=".66;1;.66" dur="3.74s" begin="-4.59s" repeatCount="indefinite"/>
 </circle>
 <path d="M6 24Q6 6 24 6H48" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
</g>
<rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<circle cx="32" cy="30" r="24.7" fill="none" stroke="#51D9C5" stroke-opacity=".09" stroke-width=".9"/>
<g>
 <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 32 30" to="360 32 30" dur="9.40s" begin="-4.59s" repeatCount="indefinite"/>
 <circle cx="32" cy="30" r="24.7" fill="none" stroke="#51D9C5" stroke-opacity=".64" stroke-width="1.55" stroke-dasharray="14 141"/>
 <circle cx="56.7" cy="30" r="2.3" fill="#51D9C5"/>
 <circle cx="56.7" cy="30" r="4.9" fill="#51D9C5" opacity=".16"/>
</g>
<g transform="translate(32 30)">
 <g>
  <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 1.35;0 -1.9;0 1.35" keyTimes="0;.5;1" dur="3.74s" begin="-4.59s" repeatCount="indefinite"/>
  <rect x="-21" y="-20" width="42" height="40" rx="9" fill="#0E9A8F" /><path d="M-11-8L-18 0-11 8M11-8L18 0 11 8M4-10L-4 10" fill="none" stroke="#F9FBFF" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" /><text x="0" y="17" fill="#D8FFF9" font-family="Arial,Helvetica,sans-serif" font-size="7.7" font-weight="800" text-anchor="middle" letter-spacing="1">API</text>
 </g>
</g>
<circle cx="13" cy="51" r="1.2" fill="#51D9C5" opacity=".4"><animate attributeName="opacity" values=".22;.8;.22" dur="3.10s" begin="-4.59s" repeatCount="indefinite"/></circle>
<circle cx="52" cy="11" r=".9" fill="#FFFFFF" opacity=".24"><animate attributeName="opacity" values=".12;.7;.12" dur="2.73s" begin="-4.59s" repeatCount="indefinite"/></circle>
</svg>