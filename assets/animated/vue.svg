<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">Vue — semantic animated logo</title>
<desc id="desc">Nested chevrons descend like Vue's progressive rendering layers. Original brand artwork retained.</desc>
